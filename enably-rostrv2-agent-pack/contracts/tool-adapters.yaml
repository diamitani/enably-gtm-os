apiVersion: rostr.ai/v2
kind: ToolAdapterRegistry
adapters:
  state.read:
    mode: read
    required: true
  state.write:
    mode: write
    approval: false
  artifact.store:
    mode: write
    approval: false
  retrieval.search:
    mode: read
    approval: false
  web.research:
    mode: read
    approval: false
    output_requirements: [url, retrieved_at, excerpt]
  crm.read:
    mode: read
    approval: oauth_consent
  crm.write:
    mode: write
    approval: explicit_user_approval
  email.send:
    mode: irreversible_write
    approval: explicit_user_approval
  social.send:
    mode: irreversible_write
    approval: explicit_user_approval
  file.export:
    mode: write
    approval: false
